<!doctype html><html lang="en-US"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><meta name="google-adsense-account" content="ca-pub-2124953371207111"><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2124953371207111" crossorigin="anonymous"></script><title>News Brief | NewsTrendus</title><meta name="description" content="Read USA news briefs on NewsTrendus with clear source attribution and relevant related coverage."><style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;background:#f5f7fb;color:#1a2940}*{box-sizing:border-box}body{margin:0;line-height:1.7}a{color:inherit}header{background:#071225;color:#fff}header>div{max-width:1050px;margin:auto;padding:18px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px}.logo{font-size:25px;font-weight:850;letter-spacing:-1px;text-decoration:none}.logo b{color:#6cbeff}.back{text-decoration:none;color:#b8d7f3;font-weight:650;font-size:14px}.container{max-width:1050px;margin:32px auto;display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:25px;padding:0 20px}.story,.sidebar{background:#fff;border:1px solid #e0e8f3;border-radius:17px;padding:clamp(20px,3.5vw,40px)}.category{color:#0d70b8;font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:800}.story h1{font-size:clamp(29px,4.6vw,47px);line-height:1.18;letter-spacing:-.04em;margin:12px 0 22px}.meta{font-size:13px;color:#6b7f95;border-top:1px solid #e8edf4;border-bottom:1px solid #e8edf4;padding:13px 0}.lead{font-size:21px;line-height:1.65;color:#26374b}.article{font-size:17px}.article h2{font-size:22px;line-height:1.3;margin:24px 0 10px}.panel{border-left:4px solid #2397e0;background:#f3f8fe;border-radius:10px;padding:13px 18px;margin:24px 0}.disclaimer{font-size:13px;line-height:1.6;color:#66788b}.source{display:inline-block;margin:12px 0 8px;padding:11px 16px;border-radius:10px;background:#176fc4;color:#fff;text-decoration:none;font-weight:750}.sidebar{align-self:start;padding:22px}.sidebar h3{margin-top:0;font-size:18px}.related{display:block;text-decoration:none;border-bottom:1px solid #e3e8f0;padding:13px 0;line-height:1.45;font-weight:650}.related span{display:block;font-size:11px;color:#77869a;margin-top:5px}.footer{font-size:13px;color:#73849a;max-width:1050px;margin:20px auto 45px;padding:0 20px}footer a{color:#1b78ca}@media(max-width:750px){.container{grid-template-columns:1fr;margin-top:18px;padding:0 12px}.sidebar{padding:20px}header>div{padding:16px}.back{font-size:12px}} 
</style></head><body><header><div><a href="index.html" class="logo">News<b>Trendus</b>.com</a><a class="back" href="index.html">← All headlines</a></div></header><div class="container"><main class="story" id="story"><p>Loading this news brief…</p></main><aside class="sidebar"><h3>More on NewsTrendus</h3><div id="related">Loading related news…</div></aside></div><footer class="footer">© NewsTrendus · <a href="privacy.html">Privacy policy</a> · This is a source-attributed automated news digest, not independent original reporting.</footer><script>
'use strict';
const escapeText=v=>String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const date=v=>v?new Date(v).toLocaleString('en-US',{month:'long',day:'numeric',year:'numeric',hour:'2-digit',minute:'2-digit',timeZone:'UTC'})+' UTC':'Date unavailable';
const id=new URLSearchParams(location.search).get('id');
const main=document.getElementById('story'),aside=document.getElementById('related');
fetch('news.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('News unavailable');return r.json()}).then(data=>{
 const stories=Array.isArray(data.items)?data.items:[],a=stories.find(x=>x.id===id);
 if(!a){main.innerHTML='<h1>Article not found</h1><p>This item may have aged out of our latest RSS snapshot. Browse the <a href="index.html">latest news</a>.</p>';aside.textContent='Browse our latest headlines.';return}
 document.title=a.title+' | NewsTrendus';
 const excerpt=a.summary?'<p class="lead">'+escapeText(a.summary)+'</p>':'<p class="lead">This topic appears in the latest reporting by '+escapeText(a.source)+'. A verified summary is not yet available from the feed.</p>';
 const brief=Array.isArray(a.brief)?a.brief.filter(s=>typeof s==='string'&&s.trim()).slice(0,5):[];
 const text=brief.length?'<h2>What we know</h2>'+brief.map(p=>'<p>'+escapeText(p)+'</p>').join(''):'';
 const note=brief.length?'This short news brief was automatically created from source-provided feed information and may omit important context. It has not been independently verified.':'The preview above comes from the publisher’s RSS feed and is shown as a short excerpt. We do not reproduce the publisher’s complete article.';
 main.innerHTML='<div class="category">'+escapeText(a.category||'News')+'</div><h1>'+escapeText(a.title)+'</h1><div class="meta">Source: '+escapeText(a.source)+' · Published: '+escapeText(date(a.date))+'</div><div class="article">'+text+(text?'<h2>Publisher preview</h2>':'<h2>News at a glance</h2>')+excerpt+'<div class="panel"><strong>About this report</strong><p class="disclaimer">'+escapeText(note)+'</p></div><h2>Where to read the verified details</h2><p>The original publisher provides the full reporting, quotes and context. NewsTrendus is a news discovery and brief-reading service.</p><a class="source" href="'+escapeText(a.url)+'" target="_blank" rel="noopener noreferrer">Original reporting: '+escapeText(a.source)+' ↗</a></div>';
 const others=stories.filter(x=>x.id!==id&&x.category===a.category).slice(0,7);
 aside.innerHTML=others.map(x=>'<a class="related" href="story.html?id='+encodeURIComponent(x.id)+'">'+escapeText(x.title)+'<span>'+escapeText(x.source)+'</span></a>').join('')||'Check the homepage for more updates.';
}).catch(()=>{main.innerHTML='<h1>News temporarily unavailable</h1><p><a href="index.html">Go to NewsTrendus</a></p>';aside.textContent='Latest related headlines unavailable.'});
</script></body></html>
