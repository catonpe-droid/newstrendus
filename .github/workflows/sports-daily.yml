name: Update world sports schedules daily
on:
  workflow_dispatch:
  schedule:
    - cron: '45 0 * * *'
permissions:
  contents: write
  actions: write
concurrency:
  group: newstrendus-sports-daily
  cancel-in-progress: false
jobs:
  update-sports:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh partial worldwide sports fixture calendar
        env:
          SPORTS_FORCE_REFRESH: '1'
        run: python scripts/sports_schedule.py
      - name: Save updated sports pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sports/
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh world sports fixtures [daily]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Trigger site deployment after scheduled sports refresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --repo "${{ github.repository }}" --ref main
