name: Deploy NewsTrendus to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: news-pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild category-aware article catalogue
        run: python scripts/editorial_catalog.py
      - name: Generate fresh original-article RSS feed
        run: python scripts/editorial_rss.py
      - name: Synchronize latest articles on home and archive
        run: python scripts/sync_editorial_lists.py
      - name: Build canonical topic guides and internal search navigation
        run: python scripts/traffic_hubs.py
      - name: Improve content quality, editorial transparency and non-indexable empty pages
        run: python scripts/content_quality.py
      - name: Enforce external-photo-only policy on all news articles
        run: python scripts/validate_editorial_images.py
      - name: Validate and regenerate technical SEO sitemap (no RSS autoblogging)
        run: python scripts/seo_build.py
      - name: Add sharing buttons and rich image previews to every original article
        run: |
          python scripts/enhance_article_sharing.py
          python scripts/enhance_article_sharing.py --check
      - name: Ensure GA4 and AdSense Auto Ads code on all eligible pages
        run: |
          python scripts/ga4_tag.py
          python scripts/adsense_tag.py
          python scripts/adsense_tag.py --check
      - name: Save site metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml news-sitemap.xml robots.txt editorial-news.json feed.xml
          git add topics/*.html
          git add -u -- '*.html'
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync SEO sitemap and GA4 [skip ci]"
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
